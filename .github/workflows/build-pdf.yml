name: Build CV

on:
  push:
    branches: [main]
    paths:
      - cv.md
      - cv.ru.md
      - template.html
      - style.css
      - build.sh
      - build-site.sh
      - fonts/**
      - .github/workflows/build-pdf.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-cv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libharfbuzz-subset0
          pipx install weasyprint==70.0

      - name: Build PDFs
        run: |
          ./build.sh cv.md yaroslav_barov.pdf
          ./build.sh cv.ru.md yaroslav_barov_ru.pdf

      - name: Commit regenerated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yaroslav_barov.pdf yaroslav_barov_ru.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged."
            exit 0
          fi
          git commit -m "chore: rebuild CV PDFs [skip ci]"
          git push

      - name: Build site
        run: ./build-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
