<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$name$ — CV</title>
<meta name="description" content="$headline$">
<link rel="stylesheet" href="$root$style.css">
$if(alt_href)$
<link rel="alternate" hreflang="$alt_lang$" href="$alt_href$">
$endif$
</head>
<body>
$if(pdf)$
<nav class="site-nav">
  <a href="$alt_href$" hreflang="$alt_lang$" lang="$alt_lang$">$alt_label$</a>
  <a href="$pdf$" download>PDF</a>
</nav>
$endif$
<header class="cv-header">
  <h1>$name$</h1>
  <p class="headline">$headline$</p>
  <p class="contacts">$for(contacts)$<span>$contacts$</span>$sep$ · $endfor$</p>
</header>
<main>
$body$
</main>
</body>
</html>
